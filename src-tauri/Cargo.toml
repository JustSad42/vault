[package]
name = "vault"
version = "0.2.1"
edition = "2021"

[lib]
name = "vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
csv = "1"
ureq = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-global-shortcut = "2"
arboard = "3"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rqrr = { version = "0.11", default-features = false }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
psl = "2.1"
eff-wordlist = "1.0"
keepass = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.62", features = ["Security_Credentials_UI", "Foundation", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
