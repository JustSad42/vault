[package]
name = "vault"
version = "0.1.0"
edition = "2021"

[lib]
name = "vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
csv = "1"
ureq = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-global-shortcut = "2"
arboard = "3"
rqrr = { version = "0.11", default-features = false }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
